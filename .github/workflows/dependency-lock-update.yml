name: VÉRANE V1 dependency lock update

on:
  push:
    branches:
      - security/v1-dependency-updates

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/v1-dependency-updates
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update lockfile and compatible audit fixes
        run: |
          npm install
          npm audit fix || true
      - name: Commit lockfile updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update vulnerable dependencies"
          git push
