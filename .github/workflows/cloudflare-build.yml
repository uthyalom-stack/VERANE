name: Cloudflare Workers compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "middleware.ts"
      - "proxy.ts"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "public/**"
      - "README.md"
      - ".gitignore"
      - ".github/workflows/cloudflare-build.yml"
  workflow_dispatch:

jobs:
  workers-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: production
      DATABASE_URL: file:./prisma/dev.db
      TURSO_DATABASE_URL: file:./prisma/dev.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Tailwind/PostCSS are build-time devDependencies; production NODE_ENV
      # must not cause npm ci to omit them in the Cloudflare build job.
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Initialize isolated local schema for build
        run: npm run db:init
      - name: Build the Cloudflare Worker
        run: npm run cf:build
      # These are deliberately fake values. The smoke test exercises only
      # static admin login and middleware behavior, never database writes or
      # third-party integrations.
      - name: Configure isolated Worker preview variables
        run: |
          cat > .dev.vars <<'EOF'
          NEXTJS_ENV=production
          TURSO_DATABASE_URL=libsql://verane-cloudflare-smoke.invalid
          TURSO_AUTH_TOKEN=cloudflare-smoke-placeholder
          ADMIN_AUTH_SECRET=cloudflare-smoke-admin-secret-not-for-production
          EOF
      - name: Run Cloudflare Workers runtime smoke tests
        run: npm run cf:smoke
