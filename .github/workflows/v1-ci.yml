name: VÉRANE V1 CI
# Initialize local schema once before regression and build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verane-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'try { const a=require("./npm-audit.json"); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2)) } catch (e) { console.log("Audit report unavailable:",e.message) }'

      - name: Initialize local SQLite schema
        run: npm run db:init
        env:
          NODE_ENV: development
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db

      - name: Run regression suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db

      - name: Build production app
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db
