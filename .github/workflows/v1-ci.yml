name: VÉRANE V1 CI
# CI validation for receipt PDF and email changes

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verane-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize local SQLite schema
        run: npm run db:init
        env:
          NODE_ENV: development
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db

      - name: Run regression suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db

      - name: Build production app
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: file:./prisma/dev.db
          TURSO_DATABASE_URL: file:./prisma/dev.db
